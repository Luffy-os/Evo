
version: 2.1

jobs:
  build-orangefox:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - checkout

      # Install build dependencies
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update

            sudo apt-get install -y \
              git git-lfs curl ca-certificates \
              python3 python-is-python3 \
              rsync bc bison build-essential flex \
              g++ gcc make \
              libssl-dev zlib1g-dev \
              libncurses-dev lib32z1-dev \
              libxml2-utils xsltproc \
              unzip zip lz4 lzop \
              squashfs-tools ccache

            git config --global user.name "Luffy"
            git config --global user.email "builder@users.noreply.github.com"
            git config --global color.ui false

            mkdir -p "$HOME/bin"

            curl -fsSL \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod +x "$HOME/bin/repo"

            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      # Inspect build machine
      - run:
          name: Check build environment
          command: |
            echo "=== CPU ==="
            nproc

            echo "=== RAM ==="
            free -h

            echo "=== DISK ==="
            df -h /

      # Sync OrangeFox 16.0
      - run:
          name: Sync OrangeFox 16.0
          no_output_timeout: 60m
          command: |
            source "$BASH_ENV"

            git clone \
              https://gitlab.com/OrangeFox/sync.git \
              "$HOME/OrangeFox_sync"

            cd "$HOME/OrangeFox_sync"

            chmod +x orangefox_sync.sh

            ./orangefox_sync.sh \
              --branch 16.0 \
              --path "$HOME/android"

      # Install Flame recovery device tree
      - run:
          name: Configure Flame device tree
          command: |
            source "$BASH_ENV"

            cd "$HOME/android"

            mkdir -p .repo/local_manifests

            cp "$PWD/local_manifests/flame.xml" \
              .repo/local_manifests/flame.xml

            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

            echo "=== Flame device tree ==="
            ls device/xiaomi/flame

      # Build OrangeFox recovery
      - run:
          name: Build OrangeFox recovery
          no_output_timeout: 60m
          command: |
            source "$BASH_ENV"

            cd "$HOME/android"

            export OF_MAINTAINER="Luffy"
            export FOX_BUILD_DEVICE=flame
            export FOX_AB_DEVICE=1
            export ALLOW_MISSING_DEPENDENCIES=true
            export LC_ALL=C

            source build/envsetup.sh

            lunch twrp_flame-ap4a-eng

            mka recoveryimage -j4 \
              2>&1 | tee "$HOME/orangefox-build.log"

      # Verify recovery image
      - run:
          name: Verify recovery image
          command: |
            cd "$HOME/android"

            echo "=== Recovery image ==="

            find out/target/product/flame \
              -maxdepth 1 \
              -name 'recovery.img' \
              -type f

            test -f out/target/product/flame/recovery.img

            ls -lh out/target/product/flame/recovery.img

      # Upload build output
      - store_artifacts:
          path: ~/android/out/target/product/flame/recovery.img
          destination: OrangeFox-flame-recovery.img

      - store_artifacts:
          path: ~/orangefox-build.log
          destination: orangefox-build.log

workflows:
  build:
    jobs:
      - build-orangefox
