
version: 2.1

jobs:

  # ==========================================
  # JOB 1: SYNC ORANGEFOX 16.0
  # ==========================================
  sync-orangefox:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - run:
          name: Install Repo launcher
          command: |
            sudo apt-get update
            sudo apt-get install -y git git-lfs curl python3 ca-certificates

            # Configure Git identity BEFORE repo init
            git config --global user.name "Luffy"
            git config --global user.email "builder@users.noreply.github.com"
            git config --global color.ui false

            mkdir -p ~/bin

            curl -fsSL \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod +x ~/bin/repo

            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Sync OrangeFox 16.0
          no_output_timeout: 60m
          command: |
            source "$BASH_ENV"

            # Ensure Git identity is available
            git config --global user.name "Luffy"
            git config --global user.email "builder@users.noreply.github.com"

            git clone \
              https://gitlab.com/OrangeFox/sync.git \
              ~/OrangeFox_sync

            cd ~/OrangeFox_sync

            chmod +x orangefox_sync.sh

            ./orangefox_sync.sh \
              --branch 16.0 \
              --path ~/android

      - run:
          name: Verify OrangeFox source
          command: |
            cd ~/android

            echo "=== Source directory ==="
            ls -la

            echo "=== Disk usage ==="
            df -h /

      - persist_to_workspace:
          root: /home/circleci
          paths:
            - android


  # ==========================================
  # JOB 2: CONFIGURE FLAME DEVICE TREE
  # ==========================================
  configure-flame:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - attach_workspace:
          at: /home/circleci

      - run:
          name: Install Repo launcher
          command: |
            sudo apt-get update
            sudo apt-get install -y git curl python3 ca-certificates

            git config --global user.name "Luffy"
            git config --global user.email "builder@users.noreply.github.com"

            mkdir -p ~/bin

            curl -fsSL \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod +x ~/bin/repo

            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Configure Flame recovery tree
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"

            cd ~/android

            mkdir -p .repo/local_manifests

            printf '%s\n' \
              '<manifest>' \
              '    <remote name="flame" fetch="https://github.com/atlas4381" />' \
              '    <project name="twrp_device_xiaomi_flame" path="device/xiaomi/flame" remote="flame" />' \
              '</manifest>' \
              > .repo/local_manifests/flame.xml

            echo "=== Flame manifest ==="
            cat .repo/local_manifests/flame.xml

            echo "=== Sync Flame device tree ==="

            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

            echo "=== Verify device tree ==="

            test -f device/xiaomi/flame/AndroidProducts.mk

            ls device/xiaomi/flame

      - persist_to_workspace:
          root: /home/circleci
          paths:
            - android


  # ==========================================
  # JOB 3: BUILD ORANGEFOX RECOVERY
  # ==========================================
  build-orangefox:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - attach_workspace:
          at: /home/circleci

      - run:
          name: Install Android build dependencies
          command: |
            sudo apt-get update

            sudo apt-get install -y \
              git git-lfs curl python3 python-is-python3 \
              ca-certificates rsync bc bison \
              build-essential flex g++ gcc make \
              libssl-dev zlib1g-dev \
              libncurses-dev lib32z1-dev \
              libxml2-utils xsltproc unzip zip \
              lz4 lzop squashfs-tools \
              fontconfig ccache

      - run:
          name: Check build environment
          command: |
            echo "=== CPU ==="
            nproc

            echo "=== RAM ==="
            free -h

            echo "=== DISK ==="
            df -h /

      - run:
          name: Build OrangeFox recovery
          no_output_timeout: 60m
          command: |
            cd ~/android

            export OF_MAINTAINER="Luffy"
            export FOX_BUILD_DEVICE=flame
            export FOX_AB_DEVICE=1
            export ALLOW_MISSING_DEPENDENCIES=true
            export LC_ALL=C

            source build/envsetup.sh

            lunch twrp_flame-ap4a-eng

            mka recoveryimage -j4 \
              2>&1 | tee ~/orangefox-build.log

      - run:
          name: Verify recovery image
          command: |
            cd ~/android

            IMAGE="out/target/product/flame/recovery.img"

            test -f "$IMAGE" || {
              echo "ERROR: recovery.img not generated"
              exit 1
            }

            echo "=== Recovery image ==="
            ls -lh "$IMAGE"

      - store_artifacts:
          path: /home/circleci/android/out/target/product/flame/recovery.img
          destination: OrangeFox-flame-recovery.img

      - store_artifacts:
          path: /home/circleci/orangefox-build.log
          destination: orangefox-build.log


# ==========================================
# WORKFLOW
# ==========================================
workflows:
  build:
    jobs:
      - sync-orangefox

      - configure-flame:
          requires:
            - sync-orangefox

      - build-orangefox:
          requires:
            - configure-flame
