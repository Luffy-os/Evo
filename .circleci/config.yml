
version: 2.1

jobs:
  sync-evolution:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - checkout

      - run:
          name: Install repo launcher
          command: |
            sudo apt-get update
            sudo apt-get install -y git curl python3 ca-certificates

            mkdir -p ~/bin
            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod +x ~/bin/repo
            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Initialize Evolution X
          command: |
            repo init \
              -u https://github.com/Evolution-X/manifest \
              -b cnb \
              --depth=1 \
              --git-lfs

      - run:
          name: Add Flame local manifest
          command: |
            mkdir -p .repo/local_manifests
            cp "$CIRCLE_WORKING_DIRECTORY/local_manifests/flame.xml" \
              .repo/local_manifests/flame.xml

      - run:
          name: Sync Android source
          no_output_timeout: 30m
          command: |
            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

      - run:
          name: Report source storage
          command: |
            echo "=== DISK ==="
            df -h /

            echo "=== SOURCE SIZE ==="
            du -sh .repo .
            
            echo "=== DEVICE TREE ==="
            ls device/xiaomi/flame

workflows:
  build:
    jobs:
      - sync-evolution
