
version: 2.1

jobs:
  sync-evolution:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - checkout

      # 1. Install dependencies and configure Git
      - run:
          name: Install dependencies
          command: |
            sudo apt-get update

            sudo apt-get install -y \
              git \
              git-lfs \
              curl \
              python3 \
              ca-certificates \
              rsync \
              bc \
              bison \
              build-essential \
              flex \
              libssl-dev \
              zlib1g-dev

            git config --global user.name "Luffy-os Builder"
            git config --global user.email "builder@users.noreply.github.com"
            git config --global color.ui false

            mkdir -p "$HOME/bin"

            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o "$HOME/bin/repo"

            chmod +x "$HOME/bin/repo"

            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      # 2. Inspect build machine
      - run:
          name: Verify build environment
          command: |
            echo "=== CPU ==="
            nproc

            echo "=== RAM ==="
            free -h

            echo "=== DISK ==="
            df -h /

            echo "=== ARCHITECTURE ==="
            uname -m

      # 3. Verify local manifest exists
      - run:
          name: Verify Flame manifest
          command: |
            echo "=== Repository directory ==="
            pwd

            echo "=== Local manifest directory ==="

            ls -la "$PWD/local_manifests/" || {
              echo "ERROR: local_manifests folder missing"
              exit 1
            }

            echo "=== XML files ==="

            find "$PWD/local_manifests" \
              -maxdepth 1 \
              -type f \
              -name '*.xml' \
              -print

            test -n "$(find "$PWD/local_manifests" \
              -maxdepth 1 -type f -name '*.xml' -print -quit)" || {
                echo "ERROR: No XML manifest found"
                exit 1
              }

      # 4. Initialize Evolution X
      - run:
          name: Initialize Evolution X
          no_output_timeout: 15m
          command: |
            source "$BASH_ENV"

            repo init \
              -u https://github.com/Evolution-X/manifest \
              -b cnb \
              --depth=1 \
              --git-lfs

      # 5. Copy local manifest
      - run:
          name: Configure Flame local manifest
          command: |
            mkdir -p .repo/local_manifests

            find "$PWD/local_manifests" \
              -maxdepth 1 \
              -type f \
              -name '*.xml' \
              -exec cp -v {} .repo/local_manifests/ \;

            echo "=== Installed manifests ==="
            ls -la .repo/local_manifests/

      # 6. Sync Android source
      - run:
          name: Sync Evolution X source
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"

            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

      # 7. Verify source
      - run:
          name: Verify Flame source
          command: |
            echo "=== Device tree ==="
            ls device/xiaomi/flame

            echo "=== Vendor tree ==="
            ls vendor/xiaomi/flame

            echo "=== Kernel tree ==="
            ls device/xiaomi/flame-kernel

            echo "=== Repo size ==="
            du -sh .repo

            echo "=== Source size ==="
            du -sh --exclude=.repo .

            echo "=== Remaining disk ==="
            df -h /

workflows:
  build:
    jobs:
      - sync-evolution
