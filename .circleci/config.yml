
version: 2.1

jobs:
  sync-orangefox:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/android

    steps:
      - run:
          name: Install repo launcher
          command: |
            sudo apt-get update
            sudo apt-get install -y git curl python3 ca-certificates

            mkdir -p ~/bin
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
            chmod +x ~/bin/repo
            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Sync OrangeFox 16.0
          no_output_timeout: 60m
          command: |
            git clone https://gitlab.com/OrangeFox/sync.git ~/OrangeFox_sync

            cd ~/OrangeFox_sync
            chmod +x orangefox_sync.sh

            ./orangefox_sync.sh \
              --branch 16.0 \
              --path ~/android

      - persist_to_workspace:
          root: /home/circleci
          paths:
            - android

  configure-flame:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/android

    steps:
      - attach_workspace:
          at: /home/circleci

      - run:
          name: Install repo launcher
          command: |
            mkdir -p ~/bin
            curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
            chmod +x ~/bin/repo
            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Configure Flame recovery tree
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"
            cd ~/android

            mkdir -p .repo/local_manifests

            cat > .repo/local_manifests/flame.xml <<'EOF'
            <manifest>
                <remote name="flame"
                        fetch="https://github.com/atlas4381" />

                <project name="twrp_device_xiaomi_flame"
                         path="device/xiaomi/flame"
                         remote="flame" />
            </manifest>
            EOF

            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

            ls device/xiaomi/flame

      - persist_to_workspace:
          root: /home/circleci
          paths:
            - android

  build-orangefox:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/android

    steps:
      - attach_workspace:
          at: /home/circleci

      - run:
          name: Build OrangeFox recovery
          no_output_timeout: 60m
          command: |
            cd ~/android

            export OF_MAINTAINER="Luffy"
            export FOX_BUILD_DEVICE=flame
            export FOX_AB_DEVICE=1
            export ALLOW_MISSING_DEPENDENCIES=true
            export LC_ALL=C

            source build/envsetup.sh
            lunch twrp_flame-ap4a-eng

            mka recoveryimage -j4 \
              2>&1 | tee ~/orangefox-build.log

      - run:
          name: Verify recovery image
          command: |
            test -f out/target/product/flame/recovery.img
            ls -lh out/target/product/flame/recovery.img

      - store_artifacts:
          path: /home/circleci/android/out/target/product/flame/recovery.img
          destination: OrangeFox-flame-recovery.img

      - store_artifacts:
          path: /home/circleci/orangefox-build.log
          destination: orangefox-build.log

workflows:
  build:
    jobs:
      - sync-orangefox

      - configure-flame:
          requires:
            - sync-orangefox

      - build-orangefox:
          requires:
            - configure-flame
