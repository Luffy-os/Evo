
version: 2.1

jobs:
  sync-evolution:
    machine:
      image: ubuntu-2404:current
    resource_class: large

    working_directory: ~/android

    steps:
      - checkout

      - run:
          name: Install dependencies and configure Git
          command: |
            sudo apt-get update
            sudo apt-get install -y \
              git curl python3 ca-certificates \
              git-lfs rsync

            git config --global user.name "Luffy-os Builder"
            git config --global user.email "builder@users.noreply.github.com"

            git config --global color.ui false

            mkdir -p ~/bin

            curl -L \
              https://storage.googleapis.com/git-repo-downloads/repo \
              -o ~/bin/repo

            chmod +x ~/bin/repo

            echo 'export PATH=$HOME/bin:$PATH' >> "$BASH_ENV"

      - run:
          name: Verify environment
          command: |
            source "$BASH_ENV"

            echo "=== CPU ==="
            nproc

            echo "=== RAM ==="
            free -h

            echo "=== DISK ==="
            df -h /

      - run:
          name: Initialize Evolution X
          no_output_timeout: 15m
          command: |
            source "$BASH_ENV"

            repo init \
              -u https://github.com/Evolution-X/manifest \
              -b cnb \
              --depth=1 \
              --git-lfs

      - run:
          name: Configure Flame local manifest
          command: |
            mkdir -p .repo/local_manifests

            cp "$CIRCLE_WORKING_DIRECTORY/local_manifests/flame.xml" \
              .repo/local_manifests/flame.xml

            echo "=== Local manifest ==="
            cat .repo/local_manifests/flame.xml

      - run:
          name: Sync Evolution X source
          no_output_timeout: 30m
          command: |
            source "$BASH_ENV"

            repo sync \
              -c \
              -j2 \
              --force-sync \
              --no-clone-bundle \
              --no-tags

      - run:
          name: Verify source and disk usage
          command: |
            echo "=== DEVICE TREE ==="
            ls device/xiaomi/flame

            echo "=== VENDOR TREE ==="
            ls vendor/xiaomi/flame

            echo "=== KERNEL TREE ==="
            ls device/xiaomi/flame-kernel

            echo "=== SOURCE SIZE ==="
            du -sh .repo .

            echo "=== REMAINING DISK ==="
            df -h /

workflows:
  build:
    jobs:
      - sync-evolution
